<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 260px; padding: 12px 16px; background: #0f1f38; color: #c9d6e8; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: #fff; letter-spacing: 0.5px; }
  .row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #1e3252; }
  .label { color: #7a9bbf; }
  .val { color: #e2eaf5; font-weight: 600; }
  .status { font-size: 11px; margin-top: 10px; padding: 6px 8px; border-radius: 4px; }
  .online { background: rgba(40,160,80,0.15); color: #4dc87a; border: 1px solid #2a5a3a; }
  .offline { background: rgba(200,50,50,0.15); color: #e06060; border: 1px solid #5a2a2a; }
  button { width: 100%; margin-top: 8px; padding: 6px; font-size: 11px; background: #1e3252; color: #c9d6e8; border: 1px solid #2d4870; border-radius: 4px; cursor: pointer; }
  button:hover { background: #2d4870; }
</style>
</head>
<body>
<h2>Warden Memory</h2>
<div id="rows"></div>
<div id="status" class="status offline">Checking API…</div>
<button id="flush">Flush Now</button>
<script src="popup.js"></script>
</body>
</html>
