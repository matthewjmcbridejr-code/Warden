<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 300px; padding: 12px 16px; background: #0f1f38; color: #c9d6e8; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: #fff; letter-spacing: 0.5px; }
  .row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #1e3252; }
  .label { color: #7a9bbf; }
  .val { color: #e2eaf5; font-weight: 600; }
  .status { font-size: 11px; margin-top: 8px; padding: 6px 8px; border-radius: 4px; }
  .online { background: rgba(40,160,80,0.15); color: #4dc87a; border: 1px solid #2a5a3a; }
  .offline { background: rgba(200,50,50,0.15); color: #e06060; border: 1px solid #5a2a2a; }
  .saving { background: rgba(80,120,200,0.15); color: #7aacef; border: 1px solid #2a4070; }
  .saved { background: rgba(40,160,80,0.15); color: #4dc87a; border: 1px solid #2a5a3a; }
  .error-msg { background: rgba(200,50,50,0.15); color: #e06060; border: 1px solid #5a2a2a; }
  .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  button { width: 100%; padding: 7px; font-size: 12px; background: #1e3252; color: #c9d6e8; border: 1px solid #2d4870; border-radius: 4px; cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { background: #2d4870; }
  button:disabled { opacity: 0.5; cursor: default; }
  #save-page { background: #1a3a6a; color: #e2eaf5; border-color: #2d5a9a; font-weight: 600; }
  #save-page:hover:not(:disabled) { background: #254e8a; }
  #save-selection { display: none; }
  .divider { border: none; border-top: 1px solid #1e3252; margin: 8px 0 4px; }
  #note-summary { font-size: 10px; color: #7a9bbf; margin-top: 6px; padding: 4px 6px; background: rgba(30,50,82,0.5); border-radius: 3px; display: none; word-break: break-word; }
</style>
</head>
<body>
<h2>Warden Watcher</h2>
<div id="rows"></div>
<div id="status" class="status offline">Checking API…</div>

<div class="actions">
  <button id="save-page">📄 Save Page to Brain</button>
  <button id="save-selection">✂️ Save Selection to Brain</button>
  <button id="save-yt" style="display:none">🎬 Save YouTube to Brain</button>
  <button id="save-pdf" style="display:none">📑 Save PDF to Brain</button>
  <hr class="divider">
  <button id="flush" style="font-size:10px;color:#7a9bbf">Flush memory queue</button>
</div>

<div id="note-summary"></div>
<script src="popup.js"></script>
</body>
</html>
