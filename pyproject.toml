[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcharness"
version = "0.1.0"
description = "A local-first agentic harness for supervised AI work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
  "pytest>=8.0",
  "uvicorn>=0.30",
  "langgraph>=1.2",
  "mcp>=1.0",
  "httpx>=0.25",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
semantic = ["sqlite-vec"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

