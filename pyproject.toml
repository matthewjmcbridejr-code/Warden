[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcharness"
version = "0.1.0"
description = "Warden — a local-first control room for supervised AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
  "pytest>=8.0",
  "uvicorn>=0.30",
  "langgraph>=1.2",
  # mcp_hub.py constructs fastmcp Tool/FuncMetadata internals directly —
  # verified against 1.28.x; review src/warden/mcp_hub.py before widening.
  "mcp>=1.28,<2",
  "httpx>=0.25",
  "pyyaml>=6.0",
  "playwright>=1.50",
]

[project.scripts]
warden = "warden.cli:main"

[project.optional-dependencies]
semantic = ["sqlite-vec"]
pdf = ["pypdf"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
